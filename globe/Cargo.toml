[package]
name = "globe"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.37"
egui_glow = "0.37"
bytemuck = "1.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.7"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Location", "UrlSearchParams", "console"] }
