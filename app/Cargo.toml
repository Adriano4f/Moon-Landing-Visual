[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
globe = { path = "../globe" }
lunar_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11"] }
egui_plot = "0.38"
ehttp = "0.7"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
